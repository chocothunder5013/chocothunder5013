<svg width="850" height="400" viewBox="0 0 850 400" fill="none" xmlns="http://www.w3.org/2000/svg">
    <style>
        .bg { fill: #050505; }
        
        /* CORE ANIMATIONS */
        @keyframes pulse {
            0% { r: 40; opacity: 0.8; filter: drop-shadow(0 0 20px #00f3ff); }
            100% { r: 45; opacity: 1; filter: drop-shadow(0 0 50px #00f3ff); }
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes spin-rev { 100% { transform: rotate(-360deg); } }

        /* MUSIC BAR ANIMATIONS */
        @keyframes music {
            0% { height: 10px; fill: #0066ff; }
            50% { height: 70px; fill: #00f3ff; filter: drop-shadow(0 0 5px #fff); }
            100% { height: 10px; fill: #ff00ff; }
        }

        /* CLASSES */
        .core-center {
            fill: #fff;
            animation: pulse 2s ease-in-out infinite alternate;
        }
        .ring-inner {
            transform-origin: 425px 150px;
            stroke: #00f3ff;
            stroke-width: 4;
            stroke-dasharray: 20 10;
            animation: spin 8s linear infinite;
        }
        .ring-outer {
            transform-origin: 425px 150px;
            stroke: #ff3333;
            stroke-width: 2;
            stroke-dasharray: 20 10;
            opacity: 0.5;
            animation: spin-rev 20s linear infinite;
        }
        
        /* BARS */
        .bar {
            width: 10px;
            rx: 2;
            transform-origin: bottom;
            animation: music 1.2s ease-in-out infinite;
        }
    </style>

    <rect width="850" height="400" class="bg" rx="15" />
    
    <defs>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#111" stroke-width="2"/>
        </pattern>
        <filter id="glow">
            <feGaussianBlur stdDeviation="4.5" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    <rect width="100%" height="100%" fill="url(#grid)" />

    <g filter="url(#glow)">
        <circle cx="425" cy="150" r="40" class="core-center" />
        
        <circle cx="425" cy="150" r="70" fill="none" class="ring-inner" />
        
        <circle cx="425" cy="150" r="100" fill="none" class="ring-outer" />
    </g>

    <g transform="translate(165, 300)"> <rect x="0" y="0" height="10" class="bar" style="animation-delay: -0.2s; animation-duration: 0.8s" />
        <rect x="15" y="0" height="10" class="bar" style="animation-delay: -0.5s; animation-duration: 1.1s" />
        <rect x="30" y="0" height="10" class="bar" style="animation-delay: -0.8s; animation-duration: 0.9s" />
        <rect x="45" y="0" height="10" class="bar" style="animation-delay: -0.1s; animation-duration: 1.3s" />
        <rect x="60" y="0" height="10" class="bar" style="animation-delay: -0.9s; animation-duration: 0.7s" />
        <rect x="75" y="0" height="10" class="bar" style="animation-delay: -0.3s; animation-duration: 1.0s" />
        <rect x="90" y="0" height="10" class="bar" style="animation-delay: -0.7s; animation-duration: 1.2s" />
        <rect x="105" y="0" height="10" class="bar" style="animation-delay: -0.2s; animation-duration: 0.8s" />
        <rect x="120" y="0" height="10" class="bar" style="animation-delay: -0.6s; animation-duration: 1.4s" />
        <rect x="135" y="0" height="10" class="bar" style="animation-delay: -0.4s; animation-duration: 0.9s" />
        <rect x="150" y="0" height="10" class="bar" style="animation-delay: -0.1s; animation-duration: 1.1s" />
        <rect x="165" y="0" height="10" class="bar" style="animation-delay: -0.8s; animation-duration: 0.6s" />
        <rect x="180" y="0" height="10" class="bar" style="animation-delay: -0.3s; animation-duration: 1.3s" />
        <rect x="195" y="0" height="10" class="bar" style="animation-delay: -0.5s; animation-duration: 1.0s" />
        <rect x="210" y="0" height="10" class="bar" style="animation-delay: -0.2s; animation-duration: 0.8s" />
        <rect x="225" y="0" height="10" class="bar" style="animation-delay: -0.7s; animation-duration: 1.2s" />
        <rect x="240" y="0" height="10" class="bar" style="animation-delay: -0.1s; animation-duration: 0.9s" />
        <rect x="255" y="0" height="10" class="bar" style="animation-delay: -0.6s; animation-duration: 1.4s" />
        <rect x="270" y="0" height="10" class="bar" style="animation-delay: -0.4s; animation-duration: 0.7s" />
        <rect x="285" y="0" height="10" class="bar" style="animation-delay: -0.9s; animation-duration: 1.1s" />
        <rect x="300" y="0" height="10" class="bar" style="animation-delay: -0.2s; animation-duration: 0.8s" />
        <rect x="315" y="0" height="10" class="bar" style="animation-delay: -0.5s; animation-duration: 1.3s" />
        <rect x="330" y="0" height="10" class="bar" style="animation-delay: -0.8s; animation-duration: 0.9s" />
        <rect x="345" y="0" height="10" class="bar" style="animation-delay: -0.3s; animation-duration: 1.0s" />
        <rect x="360" y="0" height="10" class="bar" style="animation-delay: -0.7s; animation-duration: 1.2s" />
        <rect x="375" y="0" height="10" class="bar" style="animation-delay: -0.1s; animation-duration: 0.8s" />
        <rect x="390" y="0" height="10" class="bar" style="animation-delay: -0.6s; animation-duration: 1.4s" />
        <rect x="405" y="0" height="10" class="bar" style="animation-delay: -0.4s; animation-duration: 0.9s" />
        <rect x="420" y="0" height="10" class="bar" style="animation-delay: -0.2s; animation-duration: 1.1s" />
        <rect x="435" y="0" height="10" class="bar" style="animation-delay: -0.8s; animation-duration: 0.7s" />
        <rect x="450" y="0" height="10" class="bar" style="animation-delay: -0.3s; animation-duration: 1.3s" />
        <rect x="465" y="0" height="10" class="bar" style="animation-delay: -0.5s; animation-duration: 1.0s" />
        <rect x="480" y="0" height="10" class="bar" style="animation-delay: -0.2s; animation-duration: 0.8s" />
        <rect x="495" y="0" height="10" class="bar" style="animation-delay: -0.7s; animation-duration: 1.2s" />
    </g>
</svg>
